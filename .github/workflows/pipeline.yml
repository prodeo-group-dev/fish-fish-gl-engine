name: CI

# docs/DDD_Design.md Section 10.19 - the standing gap flagged in the
# AWS-readiness assessment ("GitHub Actions is a real, standing gap").
# Runs on every PR and on every push to master, so a broken build is
# caught before merge, not discovered later.
#
# Every checkout below passes `submodules: true` - the fish-common
# submodule (Money/ValidationResult, wired into build.gradle.kts's
# main sourceSet) is otherwise left empty by actions/checkout@v4's
# default behavior, which doesn't fetch submodule content unless asked.
# Confirmed the hard way: every commit since the fish-common migration
# landed CI red (dozens of "Unresolved reference" compile errors) with
# no one noticing, since nothing was watching CI status directly -
# found and fixed in a production-readiness review, not caught at
# merge time.
#
# Filed as pipeline.yml, not ci.yml, 2026-08-26: the original ci.yml
# (workflow id 338476737) stopped producing any runs at all after
# 2026-08-21 23:43 (run #25) - every checkable config (file validity,
# repo Actions permissions, branch protection, account status,
# workflow-permissions defaults) looked completely normal, and neither
# push nor pull_request events triggered anything on it, confirmed via
# both the GitHub web UI and API. A brand-new workflow file (originally
# a throwaway ci2.yml diagnostic) triggered immediately on the same
# commit/branch, isolating the problem to that specific workflow
# registration being stuck on GitHub's side, not this repo/config. This
# file is that new registration, carrying the full original pipeline;
# ci.yml itself is deleted in the same commit rather than left stuck
# and unused.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    name: Unit tests (gradle test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Run hermetic domain tests
        run: ./gradlew test --console=plain

  integration-test:
    name: Integration tests (gradle integrationTest, real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fish_ci
          POSTGRES_PASSWORD: fish_ci_password
          POSTGRES_DB: fish_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Run integration tests against the Postgres service container
        env:
          FISH_DB_HOST: localhost
          FISH_DB_PORT: 5432
          FISH_DB_NAME: fish_dev
          FISH_DB_USER: fish_ci
          FISH_DB_PASSWORD: fish_ci_password
        run: ./gradlew integrationTest --console=plain

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build the container image (not pushed anywhere - just confirms the Dockerfile is valid)
        run: docker build -t fish-gl-engine:ci .

  # docs/GL_Production_Readiness_Plan.md Phase 1b (CD pipeline) - closes
  # the standing gap docker-build's own step comment has flagged since
  # Section 10.19 ("not pushed anywhere - just confirms the Dockerfile
  # is valid"). Deploys straight to production on every push to master
  # that passes test/integration-test/docker-build - no staging
  # environment exists yet (confirmed 2026-08-22, docs/GL_Production_Readiness_Plan.md's
  # suggested build order).
  #
  # Needs infra/terraform/ applied first, and its outputs set as the
  # GitHub Actions repository *variables* referenced below (`vars.*`,
  # not `secrets.*` - none of these are sensitive; the one genuinely
  # sensitive value, FISH_DB_PASSWORD, lives in AWS Secrets Manager and
  # never touches GitHub at all) - see infra/terraform/README.md's
  # step-by-step setup.
  #
  # Authenticates via OIDC (`aws-actions/configure-aws-credentials`'s
  # `role-to-assume`) - no long-lived AWS access keys stored in GitHub
  # secrets, matching infra/terraform/iam.tf's trust policy, which is
  # itself scoped to master-branch pushes on this repo only.
  deploy:
    name: Deploy to ECS (production)
    runs-on: ubuntu-latest
    needs: [test, integration-test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          docker build -t "$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REPOSITORY:latest" .
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY:latest"

      - name: Fetch the current task definition (Terraform owns everything except the container image - see infra/terraform/ecs.tf)
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_DEFINITION_FAMILY }}" \
            --query taskDefinition \
            > task-definition.json

      - name: Update the task definition with the newly-pushed image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ vars.ECR_REPOSITORY }}:sha-${{ github.sha }}

      - name: Deploy the new task definition and wait for the service to stabilize
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true
